apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aqua-gateway-proxy
  namespace: aqua
  labels:
    app: aqua-gateway-proxy
spec:
  gatewayClassName: "<GATEWAY_CLASS_NAME>"
  listeners:
    - name: aqua-tls-passthrough
      port: <PORT>
      protocol: TLS
      # DNS name Enforcers connect with (SNI). Must match hostnames in 003_tls-route.yaml.
      hostname: "<GATEWAY_HOSTNAME>"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
