apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: <GATEWAY_CLASS_NAME>
spec:
  # Controller name must match the installed Gateway API implementation.
  # Common values:
  #   - "gateway.envoyproxy.io/gatewayclass-controller"  (Envoy Gateway)
  #   - "istio.io/gateway-controller"                    (Istio)
  #   - "projectcontour.io/gateway-controller"           (Contour)
  #   - "gateway.nginx.org/nginx-gateway-controller"     (NGINX Gateway Fabric)
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aqua-gateway-proxy
  namespace: aqua
  labels:
    app: aqua-gateway-proxy
spec:
  gatewayClassName: "<GATEWAY_CLASS_NAME>"
  listeners:
    - name: aqua-tls-passthrough
      port: "<PORT>"
      protocol: TLS
      tls:
        mode: Passthrough
      # Optional: restrict to a specific hostname for SNI-based routing.
      # Uncomment and set if your Enforcers connect using a specific FQDN.
      # hostname: "aqua-gw.example.com"
      allowedRoutes:
        namespaces:
          from: Same
