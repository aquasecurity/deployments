apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: aqua-envoy-passthrough
  namespace: aqua
  labels:
    app: aqua-envoy-passthrough
spec:
  parentRefs:
    - name: aqua-gateway-proxy
      sectionName: aqua-tls-passthrough
  # Required by TLSRoute (Gateway API v1.6+): the SNI name Enforcers connect with.
  # Must be a DNS name (IP addresses are not allowed) and must match the
  # listener hostname in 002_gateway.yaml.
  hostnames:
    - "<GATEWAY_HOSTNAME>"
  rules:
    - backendRefs:
        - name: aqua-envoy
          port: 8443

