#Create the storage class for the Aqua Database
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: aqua-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
#Create the volume for the Aqua Database
apiVersion: v1
kind: PersistentVolume
metadata:
  name: aquadb-pv
  namespace: aqua
  labels:
    app: aqua-database
spec:
  storageClassName: aqua-storage
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /tmp/aquadb/
---
#Create a PVC for the Aqua Database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aqua-db-pvc
  namespace: aqua
spec:
  storageClassName: aqua-storage
  volumeMode: Filesystem
  volumeName: aquadb-pv
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  selector:
    matchLabels:
      app: aqua-database
---
#Create the volume for the Aqua Audit Database
apiVersion: v1
