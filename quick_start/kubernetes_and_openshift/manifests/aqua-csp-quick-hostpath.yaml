apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kube-enforcer-admission-hook-config
  namespace: aqua
webhooks:
  - name: imageassurance.aquasec.com
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["*"]
        apiVersions: ["*"]
        resources:
          - pods
          - deployments
          - deployments/scale
          - deploymentconfigs
          - replicasets
          - replicasets/scale
          - replicationcontrollers
          - replicationcontrollers/scale
          - statefulsets
          - statefulsets/scale
          - daemonsets
          - jobs
          - cronjobs
          - configmaps
          - services
          - roles
          - rolebindings
          - clusterroles
          - clusterrolebindings
          - customresourcedefinitions
          - persistentvolumes
          - persistentvolumeclaims
          - ingresses
          - networkpolicies
          - globalnetworkpolicies
      - operations: ["CREATE", "UPDATE"]
        apiGroups:
          - argoproj.io
        apiVersions:
          - v1alpha1
        resources:
          - rollouts
          - rollouts/scale
    clientConfig:
      # Placeholder: generate the CA bundle as described in "Deploying with KubeEnforcer" in quick_start/kubernetes_and_openshift/manifests/README.md
      caBundle: <base64_encoded_ca.crt>
      service:
        namespace: aqua
        name: aqua-kube-enforcer
    timeoutSeconds: 2
    failurePolicy: Ignore
    admissionReviewVersions: ["v1beta1"]
    sideEffects: "None"

---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kube-enforcer-me-injection-hook-config
  namespace: aqua
webhooks:
  - name: microenforcer.aquasec.com
    clientConfig:
      service:
        name: aqua-kube-enforcer
        namespace: aqua
        path: "/mutate"
      # Placeholder: generate the CA bundle as described in "Deploying with KubeEnforcer" in quick_start/kubernetes_and_openshift/manifests/README.md
      caBundle: <base64_encoded_ca.crt>
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["*"]
        apiVersions: ["v1"]
        resources: ["pods"]
    timeoutSeconds: 2
    failurePolicy: Ignore
    admissionReviewVersions: ["v1beta1"]
    sideEffects: "None"
---
